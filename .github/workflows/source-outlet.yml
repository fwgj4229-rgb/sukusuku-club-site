name: source アウトレット新着監視

on:
  schedule:
    - cron: "46 17 * * *"   # 毎日 2:46 JST（= 17:46 UTC）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テスト実行（メールを送らず本文をログに表示、状態も保存しない）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: source-outlet
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係インストール
        run: pip install requests beautifulsoup4

      - name: 新着チェック・メール送信
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/check_source_outlet.py --dry-run
          else
            python scripts/check_source_outlet.py
          fi

      - name: 取得状態をコミット
        run: |
          if [ -n "$(git status --porcelain data/source-outlet.json)" ]; then
            git config user.name "outlet-bot"
            git config user.email "actions@github.com"
            git add data/source-outlet.json
            git commit -m "source アウトレットの取得状態を更新 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
